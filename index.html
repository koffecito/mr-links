<style>
  :root{
    --bg: #0d0f14;
    --bg-soft: #151822;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.18);
    --text: #eef0f4;
    --text-dim: #9aa0ae;
    --accent: #d8a24a;
    --accent-soft: rgba(216,162,74,0.15);
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-display: 'Cinzel', serif;
  }
  
  .credit {
  text-align: center;
  margin-top: 18px;
  padding-bottom: 10px;
  font-size: 13px;
  color: #777;
}

.credit strong {
  color: #aaa;
  font-weight: 600;
}

.credit span {
  color: #666;
}

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    background: radial-gradient(1200px 800px at 50% -10%, #1a1e2b 0%, var(--bg) 55%);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  .page{
    max-width: 560px;
    margin: 0 auto;
    padding: 56px 18px 60px;
  }

  .section{
    margin-bottom: 30px;
  }

  .section-title{
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 12px 4px;
  }

  .link-list{
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .link-row{
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--bg-soft);
    text-decoration: none;
    color: var(--text);
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .link-row:hover{
    transform: translateY(-2px);
    border-color: var(--border-strong);
    background: linear-gradient(135deg, var(--accent-soft), transparent 60%), var(--bg-soft);
  }
  .link-row:active{ transform: translateY(0) scale(0.99); }

  .link-icon{
    flex-shrink: 0;
    width: 54px;
    height: 54px;
    border-radius: 14px;
    background: linear-gradient(145deg, #2a2f3d, #1b1e28);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .link-icon img{ width: 100%; height: 100%; object-fit: cover; }
  .link-icon svg{ width: 32px; height: 32px; stroke: var(--text-dim); }

  .link-text{ flex: 1; min-width: 0; }
  .link-title{
    font-weight: 500;
    font-size: 15.5px;
    letter-spacing: 0.01em;
  }

  .link-arrow{
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    stroke: var(--text-dim);
    transition: transform 0.15s ease, stroke 0.15s ease;
  }
  .link-row:hover .link-arrow{ transform: translateX(3px); stroke: var(--accent); }

  .link-row.expandable .link-arrow{ transform: rotate(90deg); }
  .link-row.expandable[aria-expanded="true"] .link-arrow{ transform: rotate(-90deg); }
  .link-row.expandable:hover .link-arrow{ transform: rotate(90deg) translateX(3px); }
  .link-row.expandable[aria-expanded="true"]:hover .link-arrow{ transform: rotate(-90deg) translateX(3px); }

  .sublinks{
    display: grid;
    grid-template-rows: 0fr;
    opacity: 0;
    transition: grid-template-rows 0.25s ease, opacity 0.2s ease;
  }
  .sublinks[data-open="true"]{
    grid-template-rows: 1fr;
    opacity: 1;
  }
  .sublinks-inner{
    overflow: hidden;
  }
  .sublinks-list{
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 0 2px 18px;
    border-left: 2px solid var(--border);
    margin-left: 20px;
  }
  .sublink-row{
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
    text-decoration: none;
    color: var(--text);
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .sublink-row:hover{
    transform: translateY(-1px);
    border-color: var(--border-strong);
    background: var(--accent-soft);
  }
  .sublink-icon{
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: linear-gradient(145deg, #2a2f3d, #1b1e28);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .sublink-icon img{ width: 100%; height: 100%; object-fit: cover; }
  .sublink-icon svg{ width: 17px; height: 17px; stroke: var(--text-dim); }
  .sublink-title{ font-size: 14px; font-weight: 500; padding-right: 58px; }
  .sublink-badge{ position: absolute; top: 6px; right: 8px; padding: 3px 6px; border-radius: 5px; border: 1px solid var(--border-strong); background: var(--accent-soft); color: var(--accent); font-size: 9px; font-weight: 600; line-height: 1; white-space: nowrap; letter-spacing: 0.1px; }

  .disclaimer{
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-top: 34px;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
  }
  .disclaimer-mark{
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 15px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 3px;
  }
  .disclaimer-text{
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.55;
    padding-top: 2px;
  }

  @media (max-width: 420px){
    .page{ padding: 28px 14px 48px; }
    .link-row{ padding: 12px 14px; gap: 12px; }
  }
</style>
</head>

  function iconMarkup(icon, size){
    if(IMAGE_ICONS[icon]){
      return `<img src="${IMAGE_ICONS[icon]}" alt="">`;
    }
    return `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${FALLBACK_ICON}</svg>`;
  }

  function renderSublink(item){
  return `
    <a class="sublink-row" href="${item.href}" target="_blank" rel="noopener">
      <div class="sublink-icon">${iconMarkup(item.icon)}</div>
      <div class="sublink-title">${item.title}</div>
      ${item.badge ? `<div class="sublink-badge">${item.badge}</div>` : ''}
    </a>
  `;
  }

  function renderExpandable(item){
    return `
      <div class="link-row expandable" role="button" tabindex="0" aria-expanded="false" data-toggle="${item.id}">
        <div class="link-icon">${iconMarkup(item.icon)}</div>
        <div class="link-text">
          <div class="link-title">${item.title}</div>
        </div>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </div>
      <div class="sublinks" id="sublinks-${item.id}" data-open="false">
        <div class="sublinks-inner">
          <div class="sublinks-list">
            ${item.sublinks.map(renderSublink).join('')}
          </div>
        </div>
      </div>
    `;
  }

  function renderLink(item){
    if(item.expandable){
      return renderExpandable(item);
    }
    return `
      <a class="link-row" href="${item.href}" target="_blank" rel="noopener">
        <div class="link-icon">${iconMarkup(item.icon)}</div>
        <div class="link-text">
          <div class="link-title">${item.title}</div>
        </div>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </a>
    `;
  }

  function renderSections(){
    const root = document.getElementById('sections');
    root.innerHTML = LINKS.map(section => `
      <section class="section">
        <div class="section-title">${section.category}</div>
        <div class="link-list">
          ${section.items.map(renderLink).join('')}
        </div>
      </section>
    `).join('');

    root.querySelectorAll('[data-toggle]').forEach(row => {
      row.addEventListener('click', () => {
        const id = row.getAttribute('data-toggle');
        const panel = document.getElementById(`sublinks-${id}`);
        const isOpen = panel.getAttribute('data-open') === 'true';
        panel.setAttribute('data-open', isOpen ? 'false' : 'true');
        row.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
      });
      row.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          row.click();
        }
      });
    });
  }
